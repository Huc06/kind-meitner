# Static Kind Meitner landing service. The backend service keeps its own
# manifest on main; this branch builds only deploy/landing/Dockerfile.
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/landing/Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
