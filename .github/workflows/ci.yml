name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# least privilege: CI only reads the checkout, it never writes back
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      okx: ${{ steps.scope.outputs.okx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "okx=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA")"
          full=false
          okx=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              # Dev Day / Free-MCP surface: keep the cheap okx-server gate (PR #71)
              # instead of the 3-OS + package matrix. First match wins — these must
              # stay above the broad src/* arm.
              server/okx/*|src/okx/*|src/components/Okx*|src/components/ReadinessRunCard*|src/components/TrustCard*|src/lib/okx-*|src/locales/*)
                okx=true ;;
              electron/*|companion/*|android/*|ios/*|src/*|shared/*|enterprise/*|scripts/*|Dockerfile|railway.toml|package.json|pnpm-lock.yaml|tsconfig*.json|vite.config.ts|.github/workflows/*)
                full=true ;;
              server/*) full=true ;;
              *) full=true ;;
            esac
          done <<< "$files"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "okx=$okx" >> "$GITHUB_OUTPUT"

  okx-server:
    name: typecheck + OKX / Dev Day gate
    needs: changes
    if: needs.changes.outputs.okx == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec vitest run server/okx/ src/lib/okx-action-cards.test.ts src/components/OkxGateToolResult.test.ts src/components/OkxAgentInvite.test.ts

  test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: typecheck + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The harness and pure desktop capabilities stay portable across all
        # supported host platforms. POSIX-only process tests self-skip.
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # vite.config.ts runs the suite with fileParallelism:false on purpose, so
    # wall time is the sum of every file and grows with each one added. The
    # 20m cap was set when healthy macOS/Linux runs took ~15m; they now reach
    # ~20m and cancel mid-`Run tests`, which reads as a red PR for a reason
    # no PR caused. These caps exist to catch a hang, not to ration normal
    # growth, so give each platform real margin over its observed run.
    # Keep every check and each test's own timeout unchanged.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 35 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Smoke the staged Windows CUA host (no computer actions)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: pnpm build:cua:win && pnpm smoke:cua-win
      - name: Validate locale catalogs
        if: matrix.os == 'ubuntu-latest'
        run: pnpm i18n:check
      - name: Prepare Electron test runtime
        # Electron 43 lazily downloads its runtime on first import. Resolve it
        # before Vitest starts so a cold download cannot consume the fixture
        # timeout.
        run: node --input-type=commonjs -e "require('electron')"
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Run tests
        run: pnpm test
      - run: pnpm check:electron
      - name: Verify native approval mode transitions
        if: matrix.os == 'macos-latest'
        run: pnpm exec electron scripts/smoke-approval-modes.cjs
      - name: Verify app permissions and guarded display capture
        if: matrix.os == 'macos-latest'
        run: node scripts/smoke-app-permissions.mjs
      - name: Verify paired phone authorization against packaged harness
        if: matrix.os == 'macos-latest'
        run: pnpm build:companion && pnpm exec electron scripts/smoke-phone-relay-auth.cjs
      - name: production UI build
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec vite build

  cloudflared-linux-arm64:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: cloudflared installer (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install and reuse the pinned connector in an isolated fixture
        env:
          KIND_MEITNER_ARM64_FIXTURE: ${{ runner.temp }}/kind-meitner-cloudflared-arm64
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal(process.platform, "linux"); assert.equal(process.arch, "arm64");'
          node scripts/prepare-cloudflared.mjs --current --root "$KIND_MEITNER_ARM64_FIXTURE"
          node scripts/prepare-cloudflared.mjs --current --root "$KIND_MEITNER_ARM64_FIXTURE"
          "$KIND_MEITNER_ARM64_FIXTURE/dist-native/cloudflared/linux-arm64/cloudflared" version

  foss:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # LICENSING.md promises that deleting enterprise/ leaves a working
    # open-source edition. Prove it on every change: typecheck, the edition
    # tests, and a boot that reports "oss" even with a key set.
    name: open-source edition builds without enterprise/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete the enterprise folder
        run: rm -rf enterprise
      - run: pnpm typecheck
      - run: pnpm exec vitest run server/enterprise.test.ts server/brand.test.ts
      - name: The server boots and reports the open-source edition
        run: |
          mkdir -p /tmp/kind-meitner-foss/home
          HOME=/tmp/kind-meitner-foss/home KIND_MEITNER_DATA_DIR=/tmp/kind-meitner-foss/data KIND_MEITNER_PORT=18797 KIND_MEITNER_WEBHOOK_PORT=18796 \
            KIND_MEITNER_BROWSER_CONNECTION=/tmp/kind-meitner-foss/browser-connection.json KIND_MEITNER_LICENSE_KEY=omb1.not.real \
            node --experimental-strip-types server/index.ts > /tmp/kind-meitner-foss/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18797/api/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18797/api/edition | tee /tmp/kind-meitner-foss/edition.json; echo
          grep -q '"edition":"oss"' /tmp/kind-meitner-foss/edition.json
          grep -q 'no enterprise layer exists' /tmp/kind-meitner-foss/edition.json
          kill %1; wait %1 || true

  control-plane:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: control-plane check + workerd tests + dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm control-plane:check
      - run: pnpm control-plane:test
      - run: pnpm control-plane:dry-run

  ui-smoke:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # Advisory, outside the required `test` matrix: the renderer recipe in
    # docs/verification/chat-ui.md run by a machine. It downloads the pinned
    # agent-browser release (digest verified) and its Chrome, drives the real
    # <App/> against the isolated fake-engine fixture, and keeps the screenshot.
    name: renderer smoke (control-kind-meitner ui, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Let Chrome build its sandbox on this runner
        # Ubuntu 24.04's AppArmor profile blocks unprivileged user namespaces,
        # so the downloaded Chrome for Testing dies with "No usable sandbox".
        # This is Chrome's own documented fix for 23.10+; a developer machine
        # needs nothing, and the sandbox itself stays on.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Drive the real renderer through control-kind-meitner ui
        env:
          KIND_MEITNER_UI_E2E: "1"
          KIND_MEITNER_UI_EVIDENCE_DIR: .kind-meitner-scratch/verify-evidence
        run: pnpm exec vitest run scripts/testing/control-kind-meitner-ui.e2e.test.ts scripts/testing/bot-tools-ui.e2e.test.ts
      - name: Upload the renderer screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: control-kind-meitner-ui-chat-screenshot
          path: .kind-meitner-scratch/verify-evidence/chat-ui.png
          if-no-files-found: warn
          retention-days: 7

  package-linux:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: package + smoke (Ubuntu 24.04 x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package from the verified offline CUA stage
        run: pnpm package:linux:offline
      - run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Verify the installed browser with Ubuntu sandbox restrictions
        run: node scripts/smoke-browser-bundle.mjs --resources /opt/kind-meitner/resources
      - name: Launch packaged app and verify lifecycle
        env:
          KIND_MEITNER_KEEP_SMOKE_DIR: "1"
          KIND_MEITNER_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge kind-meitner || true
      - name: Upload smoke diagnostics on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: kind-meitner-ubuntu-smoke-diagnostics
          path: |
            /tmp/kind-meitner-linux-smoke-*
            /tmp/kind-meitner-linux-smoke-runtime-*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  mobile-projects:
    name: detect mobile projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.projects.outputs.ios }}
      android: ${{ steps.projects.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: projects
        shell: bash
        run: |
          if [[ -f ios/Package.swift ]]; then echo "ios=true" >> "$GITHUB_OUTPUT"; else echo "ios=false" >> "$GITHUB_OUTPUT"; fi
          if [[ -f android/gradlew && ( -f android/settings.gradle || -f android/settings.gradle.kts ) ]]; then echo "android=true" >> "$GITHUB_OUTPUT"; else echo "android=false" >> "$GITHUB_OUTPUT"; fi

  ios:
    name: Swift tests + iOS build
    needs: mobile-projects
    if: needs.mobile-projects.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift package tests
        run: swift test --package-path ios
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build the simulator app
        run: |
          cd ios
          xcodebuild \
            -project KindMeitnerCompanion.xcodeproj \
            -scheme KindMeitnerCompanion \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Deliberately not scoped to android/**: :core's test fixtures are read from
  # ios/Tests/CompanionCoreTests/Fixtures, so a path filter would skip the
  # Kotlin suite on exactly the change that breaks it.
  android:
    name: Kotlin tests + Android build
    needs: mobile-projects
    if: needs.mobile-projects.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          # Robolectric fetches android-all-instrumented from Maven Central at
          # *test* time into ~/.m2 — 278 MB per clean machine that no Gradle
          # cache reaches. This replaces the action's default path, so
          # ~/.gradle/caches has to be named alongside it.
          cache-path: |
            ~/.gradle/caches
            ~/.m2/repository/org/robolectric
      - name: Kotlin tests and debug / preview APKs
        run: |
          cd android
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug :app:assemblePreview
      - name: Upload the installable Android preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-threads-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload the Android test reports on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests
            android/core/build/test-results
            android/app/build/reports/tests
            android/app/build/test-results
          if-no-files-found: warn
          retention-days: 7
